<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mapa Surrealista 1929 - Cronología Leonora Carrington</title>

  <!-- Three.js y MindAR para reconocimiento de imagen en WebAR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-three.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #141413;
      font-family: 'Georgia', serif;
      color: #f5f2eb;
    }

    /* Contenedor de Vista Mapa Interactivo (2D / Fallback directo sobre el JPG) */
    #map-stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #262522 0%, #111110 100%);
      z-index: 2;
      padding: 12px 12px 155px 12px;
      transition: opacity 0.35s ease;
    }

    #map-wrapper {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 4 / 3;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    #base-map-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    #overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Contenedor de Cámara WebAR */
    #ar-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: none;
    }

    /* Barra superior */
    .top-bar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .status-pill, .mode-btn {
      pointer-events: auto;
      background: rgba(20, 20, 18, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(230, 215, 185, 0.3);
      color: #f5f2eb;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .mode-btn {
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      color: #ffd166;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .mode-btn:active {
      transform: scale(0.96);
    }

    /* Panel de control inferior para los 13 sucesos */
    .hud-panel {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: min(94vw, 680px);
      background: rgba(22, 21, 19, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(230, 215, 185, 0.28);
      border-radius: 14px;
      padding: 14px 18px;
      z-index: 20;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.65);
    }

    .event-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 0.85rem;
      color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    .event-location {
      font-size: 0.95rem;
      font-weight: bold;
      color: #ebd9b4;
    }

    .event-counter {
      margin-left: auto;
      font-size: 0.78rem;
      color: #aaa396;
    }

    .event-description {
      font-size: 0.92rem;
      line-height: 1.38;
      color: #f3efe6;
      min-height: 2.7em;
      margin-bottom: 12px;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(235, 217, 180, 0.35);
      background: rgba(255, 255, 255, 0.08);
      color: #f5f2eb;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, opacity 0.2s ease, transform 0.1s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(235, 217, 180, 0.2);
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .replay-btn {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(235, 217, 180, 0.25);
      background: rgba(255, 209, 102, 0.12);
      color: #ffd166;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Barra de estado y selector de modo AR / Mapa -->
  <div class="top-bar">
    <div class="status-pill" id="status-text">Cronología interactiva: Leonora Carrington</div>
    <button class="mode-btn" id="toggle-ar-btn">📷 Escaneo AR (Cámara)</button>
  </div>

  <!-- Escenario del Mapa (muestra target/mapa_surrealista.jpg + animación de trayectos) -->
  <div id="map-stage">
    <div id="map-wrapper">
      <img id="base-map-img" src="./target/mapa_surrealista.jpg" alt="Mapa Surrealista 1929" crossorigin="anonymous" />
      <canvas id="overlay-canvas" width="1600" height="1200"></canvas>
    </div>
  </div>

  <!-- Contenedor para Cámara WebAR -->
  <div id="ar-container"></div>

  <!-- Controles de Adelante / Atrás para los 13 sucesos -->
  <div class="hud-panel">
    <div class="event-header">
      <span class="step-badge" id="step-badge">1</span>
      <span class="event-location" id="event-location">Lancashire, Inglaterra</span>
      <span class="event-counter" id="event-counter">Suceso 1 de 13</span>
    </div>
    <p class="event-description" id="event-description">
      Nace el 6 de abril de 1917 en Lancashire, Inglaterra.
    </p>
    <div class="controls-row">
      <button class="nav-btn" id="prev-btn" disabled>⬅ Atrás</button>
      <button class="replay-btn" id="replay-btn" title="Repetir animación del trayecto">↻ Trayecto</button>
      <button class="nav-btn" id="next-btn">Adelante ➡</button>
    </div>
  </div>

  <script>
    /**
     * 13 Sucesos históricos y coordenadas normalizadas (0.0 a 1.0)
     * calibradas exactamente sobre ./target/mapa_surrealista.jpg
     */
    const CHRONOLOGY = [
      {
        id: 1,
        place: "Lancashire, Inglaterra (1917)",
        text: "Nace el 6 de abril de 1917 en Lancashire, Inglaterra.",
        x: 0.089, y: 0.412,
        color: "#c84b31"
      },
      {
        id: 2,
        place: "Florencia, Italia",
        text: "Es enviada a estudiar a Florencia; conoce la Galería Uffizi.",
        x: 0.148, y: 0.452,
        color: "#2e5a27",
        ctrl: { x: 0.128, y: 0.395 }
      },
      {
        id: 3,
        place: "Londres, Inglaterra",
        text: "Estudia dibujo en la Academia de Amédée Ozenfant en Londres.",
        x: 0.093, y: 0.428,
        color: "#2b7bba",
        ctrl: { x: 0.115, y: 0.468 }
      },
      {
        id: 4,
        place: "París, Francia",
        text: "Viaja a París, donde se integra al movimiento surrealista.",
        x: 0.114, y: 0.419,
        color: "#3a7d6c",
        ctrl: { x: 0.104, y: 0.405 }
      },
      {
        id: 5,
        place: "Saint-Martin d'Ardèche, Francia",
        text: "Se instala en Saint-Martin d'Ardèche al sur de Francia, a lado de Max Ernst.",
        x: 0.113, y: 0.453,
        color: "#d1495b",
        ctrl: { x: 0.123, y: 0.436 }
      },
      {
        id: 6,
        place: "Santander, España",
        text: "Huye a España; es internada en un hospital psiquiátrico en Santander.",
        x: 0.138, y: 0.461,
        color: "#5c8d89",
        ctrl: { x: 0.126, y: 0.472 }
      },
      {
        id: 7,
        place: "Lisboa, Portugal",
        text: "En Lisboa, logra escapar de su enfermera. Se casa con Renato Leduc.",
        x: 0.106, y: 0.468,
        color: "#e07a2b",
        ctrl: { x: 0.122, y: 0.485 }
      },
      {
        id: 8,
        place: "Nueva York, EE. UU.",
        text: "Huye a Nueva York al lado de Leduc. Se reintegra al grupo surrealista.",
        x: 0.864, y: 0.408,
        color: "#e0b000",
        // Curva superior siguiendo el arco del mapa surrealista por Rusia y Alaska
        ctrl: { x: 0.485, y: 0.145 }
      },
      {
        id: 9,
        place: "Ciudad de México, México",
        text: "Llega a México, se casa con Emerico 'Chiki' Weisz. Es amiga íntima de Remedios Varo.",
        x: 0.808, y: 0.483,
        color: "#6a4c93",
        ctrl: { x: 0.855, y: 0.465 }
      },
      {
        id: 10,
        place: "Xilitla, San Luis Potosí",
        text: "Visita a Edward James en Xilitla, San Luis Potosí.",
        x: 0.823, y: 0.468,
        color: "#8d2b2b",
        ctrl: { x: 0.805, y: 0.468 }
      },
      {
        id: 11,
        place: "Nueva York, EE. UU.",
        text: "Se establece en Nueva York en varias ocasiones.",
        x: 0.873, y: 0.424,
        color: "#1982c4",
        ctrl: { x: 0.862, y: 0.455 }
      },
      {
        id: 12,
        place: "Chicago, EE. UU.",
        text: "Vive en Chicago por unos años.",
        x: 0.850, y: 0.431,
        color: "#2b580c",
        ctrl: { x: 0.862, y: 0.415 }
      },
      {
        id: 13,
        place: "Ciudad de México (2011)",
        text: "Fallece en la Ciudad de México, el 25 de mayo de 2011.",
        x: 0.809, y: 0.513,
        color: "#c93b4b",
        ctrl: { x: 0.812, y: 0.465 }
      }
    ];

    const canvas = document.getElementById("overlay-canvas");
    const ctx = canvas.getContext("2d");

    let currentIndex = 0;
    let previousIndex = null;
    let animStartTime = performance.now();
    const TRAVEL_DURATION = 1350; // ms que dura el trayecto punteado

    // Referencias UI
    const stepBadge = document.getElementById("step-badge");
    const eventLocation = document.getElementById("event-location");
    const eventCounter = document.getElementById("event-counter");
    const eventDescription = document.getElementById("event-description");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const replayBtn = document.getElementById("replay-btn");
    const toggleArBtn = document.getElementById("toggle-ar-btn");
    const statusText = document.getElementById("status-text");

    let arTexture = null;

    // Evalúa un punto en una curva Bézier cuadrática en t ∈ [0, 1]
    function getQuadraticPoint(p0, pc, p1, t) {
      const invT = 1 - t;
      return {
        x: invT * invT * p0.x + 2 * invT * t * pc.x + t * t * p1.x,
        y: invT * invT * p0.y + 2 * invT * t * pc.y + t * t * p1.y
      };
    }

    // Dibuja únicamente el trayecto activo con línea punteada hasta el progreso `progress` (0 a 1)
    function drawPartialDottedCurve(p0, pc, p1, progress, color, time) {
      const steps = 90;
      const maxStep = Math.floor(steps * progress);
      if (maxStep < 1) return;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p0.x * canvas.width, p0.y * canvas.height);

      for (let i = 1; i <= maxStep; i++) {
        const t = i / steps;
        const pt = getQuadraticPoint(p0, pc, p1, t);
        ctx.lineTo(pt.x * canvas.width, pt.y * canvas.height);
      }

      // Sombra suave para destacar sobre el mapa sin saturarlo
      ctx.shadowColor = "rgba(0, 0, 0, 0.65)";
      ctx.shadowBlur = 6;
      ctx.strokeStyle = color;
      ctx.lineWidth = 5.5;
      ctx.lineCap = "round";
      ctx.setLineDash([10, 12]);
      ctx.lineDashOffset = -(time * 0.035); // Efecto de avance en los puntos
      ctx.stroke();
      ctx.restore();

      // Punto viajero brillante en la punta del trayecto mientras avanza
      if (progress < 1) {
        const head = getQuadraticPoint(p0, pc, p1, progress);
        ctx.save();
        ctx.beginPath();
        ctx.arc(head.x * canvas.width, head.y * canvas.height, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;
        ctx.fill();
        ctx.restore();
      }
    }

    // Dibuja el efecto de pulso concéntrico al llegar al punto histórico
    function drawArrivalPulse(point, time, isArrived) {
      const cx = point.x * canvas.width;
      const cy = point.y * canvas.height;

      ctx.save();

      if (isArrived) {
        // Dos ondas expansivas de pulso
        for (let ring = 0; ring < 2; ring++) {
          const cycle = ((time * 0.0012 + ring * 0.5) % 1);
          const radius = 14 + cycle * 44;
          const alpha = (1 - cycle) * 0.85;

          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.strokeStyle = point.color;
          ctx.globalAlpha = alpha;
          ctx.lineWidth = 4;
          ctx.stroke();
        }
      }

      // Marcador central activo
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, 14, 0, Math.PI * 2);
      ctx.fillStyle = point.color;
      ctx.shadowColor = "rgba(0,0,0,0.75)";
      ctx.shadowBlur = 8;
      ctx.fill();

      ctx.lineWidth = 3;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      // Número del suceso dentro del pulso
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 14px Georgia, serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(point.id), cx, cy + 1);

      ctx.restore();
    }

    // Bucle principal de animación (limpia el lienzo para no dejar líneas fijas acumuladas)
    function renderLoop(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const currentEvent = CHRONOLOGY[currentIndex];

      if (previousIndex !== null && previousIndex !== currentIndex) {
        const prevEvent = CHRONOLOGY[previousIndex];
        const elapsed = now - animStartTime;
        const rawProgress = Math.min(1, elapsed / TRAVEL_DURATION);
        // Suavizado easeInOutCubic
        const progress = rawProgress < 0.5
          ? 4 * rawProgress * rawProgress * rawProgress
          : 1 - Math.pow(-2 * rawProgress + 2, 3) / 2;

        // Punto de control de la curva entre el suceso anterior y el actual
        const ctrlSource = currentIndex > previousIndex ? currentEvent.ctrl : prevEvent.ctrl;
        const pc = ctrlSource || {
          x: (prevEvent.x + currentEvent.x) / 2,
          y: Math.min(prevEvent.y, currentEvent.y) - 0.05
        };

        // Marcador discreto en el punto de salida
        ctx.save();
        ctx.beginPath();
        ctx.arc(prevEvent.x * canvas.width, prevEvent.y * canvas.height, 8, 0, Math.PI * 2);
        ctx.fillStyle = prevEvent.color;
        ctx.globalAlpha = 0.7;
        ctx.fill();
        ctx.restore();

        // Línea punteada animada del trayecto actual
        drawPartialDottedCurve(prevEvent, pc, currentEvent, progress, currentEvent.color, now);

        // Al llegar al destino (progress >= 0.98), activa los pulsos en el lugar
        if (progress >= 0.98) {
          drawArrivalPulse(currentEvent, now, true);
        }
      } else {
        // Suceso inicial (1) con pulso directo
        drawArrivalPulse(currentEvent, now, true);
      }

      if (arTexture) {
        arTexture.needsUpdate = true;
      }

      requestAnimationFrame(renderLoop);
    }

    // Actualiza la interfaz y dispara la animación hacia el suceso seleccionado
    function goToStep(newIndex, fromIndex = currentIndex) {
      if (newIndex < 0 || newIndex >= CHRONOLOGY.length) return;

      previousIndex = fromIndex;
      currentIndex = newIndex;
      animStartTime = performance.now();

      const item = CHRONOLOGY[currentIndex];
      stepBadge.textContent = item.id;
      stepBadge.style.backgroundColor = item.color;
      eventLocation.textContent = item.place;
      eventCounter.textContent = `Suceso ${item.id} de ${CHRONOLOGY.length}`;
      eventDescription.textContent = item.text;

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === CHRONOLOGY.length - 1;
    }

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) goToStep(currentIndex - 1, currentIndex);
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex < CHRONOLOGY.length - 1) goToStep(currentIndex + 1, currentIndex);
    });

    replayBtn.addEventListener("click", () => {
      const origin = currentIndex > 0 ? currentIndex - 1 : null;
      goToStep(currentIndex, origin);
    });

    // Soporte con teclas de flecha izquierda / derecha
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" && currentIndex < CHRONOLOGY.length - 1) {
        goToStep(currentIndex + 1, currentIndex);
      } else if (e.key === "ArrowLeft" && currentIndex > 0) {
        goToStep(currentIndex - 1, currentIndex);
      }
    });

    /**
     * Modo Cámara WebAR: compila ./target/mapa_surrealista.jpg directamente en el navegador
     * y superpone únicamente el canvas transparente con las líneas punteadas y pulsos
     */
    let arStarted = false;
    let arActive = false;
    let mindarThree = null;

    toggleArBtn.addEventListener("click", async () => {
      const mapStage = document.getElementById("map-stage");
      const arContainer = document.getElementById("ar-container");

      if (!arActive) {
        try {
          toggleArBtn.disabled = true;
          statusText.textContent = "Preparando reconocimiento de target JPG...";

          if (!arStarted) {
            const img = document.getElementById("base-map-img");
            await img.decode();

            // Compila el archivo ./target/mapa_surrealista.jpg en memoria para WebAR
            const compiler = new window.MINDAR.IMAGE.Compiler();
            await compiler.compileImageTargets([img], (progress) => {
              statusText.textContent = `Procesando mapa target: ${Math.round(progress)}%`;
            });
            const exportedBuffer = await compiler.exportData();
            const blob = new Blob([exportedBuffer]);
            const targetUrl = URL.createObjectURL(blob);

            mindarThree = new window.MINDAR.IMAGE.MindARThree({
              container: arContainer,
              imageTargetSrc: targetUrl
            });

            const { renderer, scene, camera } = mindarThree;
            const anchor = mindarThree.addAnchor(0);

            // Textura transparente con únicamente los trayectos punteados y pulsos
            arTexture = new THREE.CanvasTexture(canvas);
            const aspect = canvas.height / canvas.width;
            const planeGeo = new THREE.PlaneGeometry(1, aspect);
            const planeMat = new THREE.MeshBasicMaterial({
              map: arTexture,
              transparent: true,
              depthWrite: false
            });
            const overlayMesh = new THREE.Mesh(planeGeo, planeMat);
            anchor.group.add(overlayMesh);

            anchor.onTargetFound = () => {
              statusText.textContent = "Mapa detectado — Usa Adelante / Atrás";
            };
            anchor.onTargetLost = () => {
              statusText.textContent = "Apunta la cámara al Mapa Surrealista";
            };

            await mindarThree.start();
            renderer.setAnimationLoop(() => {
              renderer.render(scene, camera);
            });
            arStarted = true;
          } else {
            await mindarThree.start();
          }

          arActive = true;
          mapStage.style.opacity = "0";
          mapStage.style.pointerEvents = "none";
          arContainer.style.display = "block";
          toggleArBtn.textContent = "🗺️ Ver Mapa en Pantalla";
          statusText.textContent = "Apunta la cámara al Mapa Surrealista";
        } catch (err) {
          console.error(err);
          statusText.textContent = "Cámara no disponible — Modo Mapa Interactivo activo";
        } finally {
          toggleArBtn.disabled = false;
        }
      } else {
        if (mindarThree) mindarThree.stop();
        arActive = false;
        arContainer.style.display = "none";
        mapStage.style.opacity = "1";
        mapStage.style.pointerEvents = "auto";
        toggleArBtn.textContent = "📷 Escaneo AR (Cámara)";
        statusText.textContent = "Cronología interactiva: Leonora Carrington";
      }
    });

    // Inicia en el Suceso 1 y arranca el bucle de animación
    goToStep(0, null);
    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
