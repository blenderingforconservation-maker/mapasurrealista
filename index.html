<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mapa Surrealista 1929 — Experiencia WebAR Museo</title>

  <!-- Motores 3D y Reconocimiento de Imagen WebAR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-three.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0b0a;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #f5f2eb;
    }

    /* Pantalla de Bienvenida para el Visitante del Museo */
    #welcome-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: radial-gradient(circle at center, #23211d 0%, #0b0b0a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: opacity 0.4s ease;
    }

    .welcome-card {
      max-width: 420px;
      background: rgba(25, 24, 21, 0.9);
      border: 1px solid rgba(235, 217, 180, 0.25);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    .welcome-sub {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #d4c3a3;
      margin-bottom: 8px;
    }

    .welcome-title {
      font-family: 'Georgia', serif;
      font-size: 1.6rem;
      font-style: italic;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .welcome-desc {
      font-size: 0.92rem;
      line-height: 1.45;
      color: #ccc5b9;
      margin-bottom: 24px;
    }

    .primary-ar-btn {
      width: 100%;
      padding: 15px 20px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #ffd166 0%, #e09f3e 100%);
      color: #141413;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 209, 102, 0.35);
      margin-bottom: 12px;
      transition: transform 0.15s ease;
    }

    .primary-ar-btn:active {
      transform: scale(0.97);
    }

    .secondary-2d-btn {
      width: 100%;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      color: #dcd6c8;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Contenedor de Cámara WebAR */
    #ar-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: none;
    }

    /* Guía en pantalla cuando el visitante busca el mapa con la cámara */
    #scan-guide {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .scan-frame {
      width: min(78vw, 380px);
      aspect-ratio: 4 / 3;
      border: 2px dashed rgba(255, 209, 102, 0.75);
      border-radius: 16px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.38);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }

    .scan-frame span {
      background: rgba(12, 12, 11, 0.85);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: #ffd166;
      border: 1px solid rgba(255, 209, 102, 0.35);
    }

    /* Vista Previa 2D (Para probar en laptop sin usar cámara) */
    #map-stage {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1f1e1b 0%, #090908 100%);
      z-index: 2;
      padding: 65px 16px 95px 16px;
    }

    #map-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 4 / 3;
      border-radius: 10px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    #clean-map-canvas, #overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #overlay-canvas {
      pointer-events: none;
    }

    /* Barra Superior */
    .top-bar {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 25;
      pointer-events: none;
    }

    .status-badge, .switch-mode-btn {
      pointer-events: auto;
      background: rgba(14, 14, 13, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f5f2eb;
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .switch-mode-btn {
      cursor: pointer;
      color: #ffd166;
      border-color: rgba(255, 209, 102, 0.35);
    }

    /* Controles de Avance y Retroceso (13 Destinos) */
    .hud-controls {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: min(94vw, 520px);
      background: rgba(14, 14, 13, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 25;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.75);
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .location-display {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .color-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 12px currentColor;
    }

    .location-name {
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    /* Imagen fuente oculta */
    #source-map-img {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Imagen original en tu carpeta target/ -->
  <img id="source-map-img" src="./target/mapa_surrealista.jpg" crossorigin="anonymous" alt="Mapa Fuente" />

  <!-- Pantalla de Entrada para el Visitante -->
  <div id="welcome-screen">
    <div class="welcome-card">
      <div class="welcome-sub">Museo Leonora Carrington</div>
      <h1 class="welcome-title">Mapa Surrealista (1929)</h1>
      <p class="welcome-desc">
        Apunta tu cámara hacia el mapa de la sala para desplegar el lienzo flotante en Realidad Aumentada y recorrer los 13 destinos con los botones inferiores.
      </p>
      <button class="primary-ar-btn" id="start-ar-btn">📷 Iniciar Cámara AR</button>
      <button class="secondary-2d-btn" id="start-2d-btn">🗺️ Ver Mapa Interactivo (Sin Cámara)</button>
    </div>
  </div>

  <!-- Barra Superior -->
  <div class="top-bar">
    <div class="status-badge" id="status-text">Preparando lienzo...</div>
    <button class="switch-mode-btn" id="switch-mode-btn">Cambiar a Vista 2D</button>
  </div>

  <!-- Guía de Escaneo en Cámara -->
  <div id="scan-guide">
    <div class="scan-frame">
      <span>Apunta al Mapa Surrealista de la pared</span>
    </div>
  </div>

  <!-- Escenario 2D de Respaldo -->
  <div id="map-stage">
    <div id="map-wrapper">
      <canvas id="clean-map-canvas" width="1600" height="1200"></canvas>
      <canvas id="overlay-canvas" width="1600" height="1200"></canvas>
    </div>
  </div>

  <!-- Contenedor de Cámara WebAR -->
  <div id="ar-container"></div>

  <!-- Botones de Control para los 13 Destinos -->
  <div class="hud-controls">
    <button class="nav-btn" id="prev-btn" disabled>⬅ Atrás</button>
    <div class="location-display" id="replay-btn" title="Toca para repetir el recorrido">
      <div class="color-dot" id="color-dot"></div>
      <div class="location-name" id="location-name">1. Lancashire</div>
    </div>
    <button class="nav-btn" id="next-btn">Adelante ➡</button>
  </div>

  <script>
    /**
     * 13 Destinos calibrados con curvas Bézier cúbicas (cp1, cp2) y su color propio.
     */
    const CHRONOLOGY = [
      { id: 1,  city: "Lancashire",       x: 0.089, y: 0.412, color: "#e64833" },
      {
        id: 2,  city: "Florencia",        x: 0.148, y: 0.452, color: "#43a047",
        cp1: { x: 0.112, y: 0.398 }, cp2: { x: 0.138, y: 0.415 }
      },
      {
        id: 3,  city: "Londres",          x: 0.093, y: 0.428, color: "#29b6f6",
        cp1: { x: 0.128, y: 0.468 }, cp2: { x: 0.105, y: 0.455 }
      },
      {
        id: 4,  city: "París",            x: 0.114, y: 0.419, color: "#26a69a",
        cp1: { x: 0.098, y: 0.412 }, cp2: { x: 0.108, y: 0.408 }
      },
      {
        id: 5,  city: "Saint-Martin",     x: 0.113, y: 0.453, color: "#ef5350",
        cp1: { x: 0.124, y: 0.430 }, cp2: { x: 0.124, y: 0.444 }
      },
      {
        id: 6,  city: "Santander",        x: 0.138, y: 0.461, color: "#42a5f5",
        cp1: { x: 0.120, y: 0.470 }, cp2: { x: 0.130, y: 0.472 }
      },
      {
        id: 7,  city: "Lisboa",           x: 0.106, y: 0.468, color: "#ffa726",
        cp1: { x: 0.128, y: 0.484 }, cp2: { x: 0.114, y: 0.484 }
      },
      {
        id: 8,  city: "Nueva York",       x: 0.864, y: 0.408, color: "#ffee58",
        cp1: { x: 0.275, y: 0.155 }, cp2: { x: 0.695, y: 0.145 }
      },
      {
        id: 9,  city: "Ciudad de México", x: 0.808, y: 0.483, color: "#ab47bc",
        cp1: { x: 0.862, y: 0.448 }, cp2: { x: 0.838, y: 0.478 }
      },
      {
        id: 10, city: "Xilitla",          x: 0.823, y: 0.468, color: "#ef5350",
        cp1: { x: 0.805, y: 0.472 }, cp2: { x: 0.812, y: 0.464 }
      },
      {
        id: 11, city: "Nueva York",       x: 0.873, y: 0.424, color: "#26c6da",
        cp1: { x: 0.848, y: 0.462 }, cp2: { x: 0.868, y: 0.445 }
      },
      {
        id: 12, city: "Chicago",          x: 0.850, y: 0.431, color: "#66bb6a",
        cp1: { x: 0.866, y: 0.414 }, cp2: { x: 0.856, y: 0.418 }
      },
      {
        id: 13, city: "Ciudad de México", x: 0.809, y: 0.513, color: "#ff5252",
        cp1: { x: 0.822, y: 0.455 }, cp2: { x: 0.805, y: 0.485 }
      }
    ];

    const sourceImg = document.getElementById("source-map-img");
    const cleanMapCanvas = document.getElementById("clean-map-canvas");
    const cleanCtx = cleanMapCanvas.getContext("2d");
    const overlayCanvas = document.getElementById("overlay-canvas");
    const ctx = overlayCanvas.getContext("2d", { alpha: true });

    const welcomeScreen = document.getElementById("welcome-screen");
    const startArBtn = document.getElementById("start-ar-btn");
    const start2dBtn = document.getElementById("start-2d-btn");
    const switchModeBtn = document.getElementById("switch-mode-btn");
    const scanGuide = document.getElementById("scan-guide");
    const mapStage = document.getElementById("map-stage");
    const arContainer = document.getElementById("ar-container");
    const statusText = document.getElementById("status-text");

    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const replayBtn = document.getElementById("replay-btn");
    const locationName = document.getElementById("location-name");
    const colorDot = document.getElementById("color-dot");

    let currentIndex = 0;
    let previousIndex = null;
    let animStart = performance.now();
    let isTraveling = false;
    let particles = [];
    let arAnimTexture = null;
    let arCleanMapTexture = null;

    let lastRenderTime = 0;
    const IDLE_FRAME_INTERVAL = 1000 / 24;
    const DURATION = 1350;

    /**
     * Construye automáticamente el Mapa Flotante Limpio a partir de mapa_surrealista.jpg:
     * Cubre de forma suave el bloque inferior de los 13 textos históricos usando
     * el tono original del papel para que el mapa flotante luzca despejado.
     */
    async function buildCleanFloatingMap() {
      if (!sourceImg.complete) {
        await new Promise((res) => { sourceImg.onload = res; sourceImg.onerror = res; });
      }

      const w = cleanMapCanvas.width;
      const h = cleanMapCanvas.height;

      cleanCtx.clearRect(0, 0, w, h);
      cleanCtx.drawImage(sourceImg, 0, 0, w, h);

      // Cubrir el listado de los 13 sucesos históricos en la esquina inferior izquierda
      // con un gradiente que iguala el tono pergamino/grisáceo de esa zona del mapa
      const patchX = w * 0.06;
      const patchY = h * 0.705;
      const patchW = w * 0.49;
      const patchH = h * 0.255;

      const paperGrad = cleanCtx.createLinearGradient(patchX, patchY, patchX + patchW, patchY + patchH);
      paperGrad.addColorStop(0, "rgba(154, 152, 143, 0.96)");
      paperGrad.addColorStop(0.5, "rgba(160, 158, 149, 0.98)");
      paperGrad.addColorStop(1, "rgba(150, 148, 139, 0.96)");

      cleanCtx.save();
      cleanCtx.fillStyle = paperGrad;
      cleanCtx.beginPath();
      cleanCtx.roundRect(patchX, patchY, patchW, patchH, 18);
      cleanCtx.fill();
      cleanCtx.restore();

      if (arCleanMapTexture) {
        arCleanMapTexture.needsUpdate = true;
      }
      statusText.textContent = "Mapa listo";
    }

    function getCubicBezierPoint(p0, p1, p2, p3, t) {
      const u = 1 - t;
      const tt = t * t;
      const uu = u * u;
      const uuu = uu * u;
      const ttt = tt * t;

      return {
        x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
        y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y
      };
    }

    function getRouteControlPoints(fromNode, toNode, fromIdx, toIdx) {
      const movingForward = toIdx > fromIdx;
      const routeOwner = movingForward ? toNode : fromNode;

      if (routeOwner.cp1 && routeOwner.cp2) {
        return movingForward
          ? { cp1: routeOwner.cp1, cp2: routeOwner.cp2 }
          : { cp1: routeOwner.cp2, cp2: routeOwner.cp1 };
      }

      return {
        cp1: { x: fromNode.x + (toNode.x - fromNode.x) * 0.33, y: Math.min(fromNode.y, toNode.y) - 0.04 },
        cp2: { x: fromNode.x + (toNode.x - fromNode.x) * 0.66, y: Math.min(fromNode.y, toNode.y) - 0.04 }
      };
    }

    function hexToRgba(hex, a) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${a})`;
    }

    function emitParticles(x, y, color) {
      particles = [];
      for (let i = 0; i < 28; i++) {
        const angle = (Math.PI * 2 * i) / 28 + (Math.random() - 0.5) * 0.2;
        const speed = 1.6 + Math.random() * 3.2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 2.5 + Math.random() * 3.2,
          color,
          alpha: 1
        });
      }
    }

    function render(time) {
      requestAnimationFrame(render);
      if (document.hidden) return;

      const highFreqNeeded = isTraveling || particles.length > 0;
      if (!highFreqNeeded && (time - lastRenderTime < IDLE_FRAME_INTERVAL)) {
        return;
      }
      lastRenderTime = time;

      ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
      const current = CHRONOLOGY[currentIndex];

      // 1. Animación del trayecto punteado activo
      if (previousIndex !== null && previousIndex !== currentIndex) {
        const prev = CHRONOLOGY[previousIndex];
        const elapsed = time - animStart;
        const progress = Math.min(elapsed / DURATION, 1);
        const easeProgress = 1 - Math.pow(1 - progress, 4);

        const { cp1, cp2 } = getRouteControlPoints(prev, current, previousIndex, currentIndex);

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(prev.x * overlayCanvas.width, prev.y * overlayCanvas.height);

        const steps = 90;
        const currentSteps = Math.floor(steps * easeProgress);

        for (let i = 1; i <= currentSteps; i++) {
          const pt = getCubicBezierPoint(prev, cp1, cp2, current, i / steps);
          ctx.lineTo(pt.x * overlayCanvas.width, pt.y * overlayCanvas.height);
        }

        ctx.strokeStyle = current.color;
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.setLineDash([10, 14]);
        ctx.lineDashOffset = -(time * 0.05);
        ctx.shadowColor = current.color;
        ctx.shadowBlur = 16;
        ctx.stroke();

        // Línea central blanca para mayor contraste sobre el mapa flotante
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        if (progress < 1) {
          const head = getCubicBezierPoint(prev, cp1, cp2, current, easeProgress);
          ctx.save();
          ctx.beginPath();
          ctx.arc(head.x * overlayCanvas.width, head.y * overlayCanvas.height, 9, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = current.color;
          ctx.shadowBlur = 20;
          ctx.fill();
          ctx.restore();
        } else if (isTraveling) {
          isTraveling = false;
          emitParticles(current.x * overlayCanvas.width, current.y * overlayCanvas.height, current.color);
        }
      }

      // 2. Explosión de partículas del color del destino
      if (particles.length > 0) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.96;
          p.vy *= 0.96;
          p.alpha -= 0.022;

          if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = hexToRgba(p.color, p.alpha);
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 14;
          ctx.fill();
        }
        ctx.restore();
      }

      // 3. Pulso de brillo cromático del color de la ciudad actual
      const cx = current.x * overlayCanvas.width;
      const cy = current.y * overlayCanvas.height;
      const beat = 0.5 + 0.5 * Math.sin(time * 0.0055);

      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      const outerRadius = 36 + beat * 30;
      const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, outerRadius);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.28, hexToRgba(current.color, 0.95));
      grad.addColorStop(0.65, hexToRgba(current.color, 0.4));
      grad.addColorStop(1, hexToRgba(current.color, 0));

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, outerRadius, 0, Math.PI * 2);
      ctx.fill();

      // Dos ondas expansivas del color de la ciudad
      for (let w = 0; w < 2; w++) {
        const waveCycle = ((time * 0.001) + w * 0.5) % 1;
        const waveRadius = 14 + waveCycle * 54;
        ctx.beginPath();
        ctx.arc(cx, cy, waveRadius, 0, Math.PI * 2);
        ctx.strokeStyle = hexToRgba(current.color, (1 - waveCycle) * 0.9);
        ctx.lineWidth = 3.5;
        ctx.stroke();
      }
      ctx.restore();

      // Esfera central con el número del punto
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, 13, 0, Math.PI * 2);
      ctx.fillStyle = current.color;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.shadowColor = "rgba(0,0,0,0.8)";
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(current.id), cx, cy + 1);
      ctx.restore();

      if (arAnimTexture) {
        arAnimTexture.needsUpdate = true;
      }
    }

    function updateLocation(newIndex, originIndex = currentIndex) {
      previousIndex = originIndex;
      currentIndex = newIndex;
      animStart = performance.now();
      isTraveling = (originIndex !== null && originIndex !== newIndex);

      const loc = CHRONOLOGY[currentIndex];
      if (!isTraveling) {
        emitParticles(loc.x * overlayCanvas.width, loc.y * overlayCanvas.height, loc.color);
      }

      locationName.textContent = `${loc.id}. ${loc.city}`;
      colorDot.style.backgroundColor = loc.color;
      colorDot.style.color = loc.color;

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === CHRONOLOGY.length - 1;
    }

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) updateLocation(currentIndex - 1, currentIndex);
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex < CHRONOLOGY.length - 1) updateLocation(currentIndex + 1, currentIndex);
    });

    replayBtn.addEventListener("click", () => {
      const origin = currentIndex > 0 ? currentIndex - 1 : null;
      updateLocation(currentIndex, origin);
    });

    /**
     * Motor WebAR con Doble Plano Flotante 3D:
     * - Plano 1 (Z = 0.04): Mapa Limpio Flotante que cubre el mural real.
     * - Plano 2 (Z = 0.085): Capa de Animación con rutas punteadas y pulsos en relieve.
     */
    const PRECOMPILED_MIND_PATH = "./target/mapa_surrealista.mind";
    let arActive = false;
    let arInstance = null;

    async function resolveTargetSource() {
      try {
        const res = await fetch(PRECOMPILED_MIND_PATH, { method: "HEAD", cache: "no-cache" });
        if (res.ok) {
          return PRECOMPILED_MIND_PATH;
        }
      } catch (_) {}

      statusText.textContent = "Procesando mapa por primera vez...";
      const compiler = new window.MINDAR.IMAGE.Compiler();
      await compiler.compileImageTargets([sourceImg], (p) => {
        statusText.textContent = `Preparando AR: ${Math.round(p)}%`;
      });
      const buffer = await compiler.exportData();
      return URL.createObjectURL(new Blob([buffer], { type: "application/octet-stream" }));
    }

    async function startARExperience() {
      welcomeScreen.style.opacity = "0";
      setTimeout(() => { welcomeScreen.style.display = "none"; }, 400);

      try {
        statusText.textContent = "Iniciando cámara AR...";
        await buildCleanFloatingMap();

        if (!arInstance) {
          const targetSrc = await resolveTargetSource();

          arInstance = new window.MINDAR.IMAGE.MindARThree({
            container: arContainer,
            imageTargetSrc: targetSrc,
            filterMinCF: 0.001,
            filterBeta: 0.008,
            missTolerance: 6,
            warmupTolerance: 4
          });

          const { renderer, scene, camera } = arInstance;
          const anchor = arInstance.addAnchor(0);
          const aspect = overlayCanvas.height / overlayCanvas.width;

          // Sombra trasera suave para despegar el mapa flotante de la pared del museo
          const shadowMat = new THREE.MeshBasicMaterial({
            color: 0x000000,
            transparent: true,
            opacity: 0.55,
            depthWrite: false
          });
          const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(1.06, aspect * 1.06), shadowMat);
          shadowPlane.position.set(0, -0.015, 0.01);
          anchor.group.add(shadowPlane);

          // PLANO 1 (Z = 0.04): Mapa Limpio Flotante
          arCleanMapTexture = new THREE.CanvasTexture(cleanMapCanvas);
          arCleanMapTexture.minFilter = THREE.LinearFilter;
          arCleanMapTexture.magFilter = THREE.LinearFilter;

          const cleanMapPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(1.02, aspect * 1.02),
            new THREE.MeshBasicMaterial({ map: arCleanMapTexture })
          );
          cleanMapPlane.position.set(0, 0, 0.04);
          anchor.group.add(cleanMapPlane);

          // PLANO 2 (Z = 0.085): Animaciones flotando por delante del mapa limpio
          arAnimTexture = new THREE.CanvasTexture(overlayCanvas);
          arAnimTexture.minFilter = THREE.LinearFilter;
          arAnimTexture.magFilter = THREE.LinearFilter;
          arAnimTexture.generateMipmaps = false;

          const animPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(1.02, aspect * 1.02),
            new THREE.MeshBasicMaterial({
              map: arAnimTexture,
              transparent: true,
              depthWrite: false
            })
          );
          animPlane.position.set(0, 0, 0.085);
          anchor.group.add(animPlane);

          anchor.onTargetFound = () => {
            scanGuide.style.display = "none";
            statusText.textContent = "Mapa Flotante Activo — Usa Atrás / Adelante";
          };

          anchor.onTargetLost = () => {
            scanGuide.style.display = "flex";
            statusText.textContent = "Apunta al Mapa Surrealista";
          };

          await arInstance.start();
          renderer.setAnimationLoop(() => renderer.render(scene, camera));
        } else {
          await arInstance.start();
        }

        arActive = true;
        mapStage.style.display = "none";
        arContainer.style.display = "block";
        scanGuide.style.display = "flex";
        switchModeBtn.textContent = "Ver Mapa 2D";
        statusText.textContent = "Apunta al Mapa Surrealista";
      } catch (err) {
        console.error(err);
        open2DMode();
        statusText.textContent = "Cámara no disponible — Modo 2D Activo";
      }
    }

    async function open2DMode() {
      welcomeScreen.style.opacity = "0";
      setTimeout(() => { welcomeScreen.style.display = "none"; }, 400);

      if (arInstance && arActive) {
        arInstance.stop();
      }
      arActive = false;
      scanGuide.style.display = "none";
      arContainer.style.display = "none";
      await buildCleanFloatingMap();
      mapStage.style.display = "flex";
      switchModeBtn.textContent = "📷 Activar Cámara AR";
      statusText.textContent = "Vista Interactiva 2D";
    }

    startArBtn.addEventListener("click", startARExperience);
    start2dBtn.addEventListener("click", open2DMode);

    switchModeBtn.addEventListener("click", () => {
      if (arActive) {
        open2DMode();
      } else {
        startARExperience();
      }
    });

    // Inicializar animación y lienzo limpio
    buildCleanFloatingMap();
    updateLocation(0, null);
    requestAnimationFrame(render);
  </script>
</body>
</html>
