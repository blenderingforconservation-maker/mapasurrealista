<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mapa Surrealista 1929 - WebAR Interactivo</title>

  <!-- Dependencias Core: Three.js y MindAR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-three.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0a0a;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    /* Vista 2D / Fallback */
    #map-stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
      z-index: 2;
      padding: 20px 20px 100px 20px;
      transition: opacity 0.3s ease;
    }

    #map-wrapper {
      position: relative;
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 4 / 3;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    #base-map-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Canvas para vectores y partículas superpuestas */
    #overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Contenedor WebAR */
    #ar-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: none;
    }

    /* Interfaz de Usuario Minimalista */
    .top-bar {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    .status-badge, .ar-toggle-btn {
      pointer-events: auto;
      background: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .ar-toggle-btn {
      cursor: pointer;
      color: #00d2ff;
      border-color: rgba(0, 210, 255, 0.3);
      transition: all 0.2s ease;
    }

    .ar-toggle-btn:active {
      transform: scale(0.95);
    }

    /* Controles de Navegación */
    .hud-controls {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 15, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 40px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 20;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .nav-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
    }

    .location-display {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 15px;
      cursor: pointer;
    }

    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }

    .location-name {
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      min-width: 120px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="status-badge" id="status-text">Sistema AR Iniciado</div>
    <button class="ar-toggle-btn" id="toggle-ar-btn">Activar Cámara AR</button>
  </div>

  <!-- Vista 2D de respaldo y previsualización -->
  <div id="map-stage">
    <div id="map-wrapper">
      <img id="base-map-img" src="./target/mapa_surrealista.jpg" alt="Mapa Base" crossorigin="anonymous" />
      <canvas id="overlay-canvas" width="1600" height="1200"></canvas>
    </div>
  </div>

  <div id="ar-container"></div>

  <!-- Interfaz de Control (Sin textos descriptivos) -->
  <div class="hud-controls">
    <button class="nav-btn" id="prev-btn" disabled>Atrás</button>
    <div class="location-display" id="replay-btn" title="Repetir animación">
      <div class="color-dot" id="color-dot"></div>
      <div class="location-name" id="location-name">Lancashire</div>
    </div>
    <button class="nav-btn" id="next-btn">Siguiente</button>
  </div>

  <script>
    /**
     * Coordenadas de los 13 sucesos y colores cromáticos exactos extraídos del mapa de 1929.
     */
    const CHRONOLOGY = [
      { id: 1,  city: "Lancashire",             x: 0.089, y: 0.412, color: "#d94a38" },
      { id: 2,  city: "Florencia",              x: 0.148, y: 0.452, color: "#377d33", ctrl: { x: 0.128, y: 0.395 } },
      { id: 3,  city: "Londres",                x: 0.093, y: 0.428, color: "#2e86c1" },
      { id: 4,  city: "París",                  x: 0.114, y: 0.419, color: "#1e8449" },
      { id: 5,  city: "Saint-Martin",           x: 0.113, y: 0.453, color: "#c0392b" },
      { id: 6,  city: "Santander",              x: 0.138, y: 0.461, color: "#5499c7", ctrl: { x: 0.126, y: 0.472 } },
      { id: 7,  city: "Lisboa",                 x: 0.106, y: 0.468, color: "#e67e22", ctrl: { x: 0.122, y: 0.485 } },
      { id: 8,  city: "Nueva York",             x: 0.864, y: 0.408, color: "#f1c40f", ctrl: { x: 0.485, y: 0.145 } },
      { id: 9,  city: "Ciudad de México",       x: 0.808, y: 0.483, color: "#8e44ad", ctrl: { x: 0.855, y: 0.465 } },
      { id: 10, city: "Xilitla",                x: 0.823, y: 0.468, color: "#b03a2e" },
      { id: 11, city: "Nueva York",             x: 0.873, y: 0.424, color: "#17a589" },
      { id: 12, city: "Chicago",                x: 0.850, y: 0.431, color: "#239b56" },
      { id: 13, city: "Ciudad de México",       x: 0.809, y: 0.513, color: "#cb4335", ctrl: { x: 0.812, y: 0.465 } }
    ];

    const canvas = document.getElementById("overlay-canvas");
    const ctx = canvas.getContext("2d");

    // UI Elements
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const replayBtn = document.getElementById("replay-btn");
    const locationName = document.getElementById("location-name");
    const colorDot = document.getElementById("color-dot");
    const statusText = document.getElementById("status-text");
    const toggleArBtn = document.getElementById("toggle-ar-btn");

    let currentIndex = 0;
    let previousIndex = null;
    let animStart = performance.now();
    let particles = [];
    let arTexture = null;
    const DURATION = 1200; // ms

    // Utilidad: Curvas Bézier
    function getBezierPoint(p0, p1, p2, t) {
      const u = 1 - t;
      return {
        x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
        y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y
      };
    }

    // Hex a RGBA para brillos
    function hexToRgba(hex, a) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${a})`;
    }

    // Generador del destello de partículas
    function emitParticles(x, y, color) {
      particles = []; // Limpiar anteriores
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 2 + Math.random() * 2,
          color,
          alpha: 1
        });
      }
    }

    // Lógica principal de renderizado
    function render(time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const current = CHRONOLOGY[currentIndex];

      if (previousIndex !== null && previousIndex !== currentIndex) {
        const prev = CHRONOLOGY[previousIndex];
        const elapsed = time - animStart;
        const progress = Math.min(elapsed / DURATION, 1);
        
        // Función de aceleración easeOutQuart
        const easeProgress = 1 - Math.pow(1 - progress, 4);

        const ctrl = current.ctrl || prev.ctrl || {
          x: (prev.x + current.x) / 2,
          y: Math.min(prev.y, current.y) - 0.1
        };

        // Dibujar línea de trayecto dinámico
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(prev.x * canvas.width, prev.y * canvas.height);
        
        const steps = 60;
        const currentSteps = Math.floor(steps * easeProgress);
        
        for (let i = 1; i <= currentSteps; i++) {
          const pt = getBezierPoint(prev, ctrl, current, i / steps);
          ctx.lineTo(pt.x * canvas.width, pt.y * canvas.height);
        }

        ctx.strokeStyle = current.color;
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.setLineDash([8, 12]);
        ctx.lineDashOffset = -(time * 0.05);
        ctx.shadowColor = current.color;
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.restore();

        // Disparar destello al llegar
        if (progress >= 1 && particles.length === 0) {
          emitParticles(current.x * canvas.width, current.y * canvas.height, current.color);
        }
      }

      // Dibujar partículas activas
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          return;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(p.color, p.alpha);
        ctx.fill();
      });
      ctx.restore();

      // Dibujar Pulso Cromático Constante en el destino
      const cx = current.x * canvas.width;
      const cy = current.y * canvas.height;
      const pulseSize = 10 + Math.sin(time * 0.005) * 5;

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, pulseSize, 0, Math.PI * 2);
      ctx.fillStyle = hexToRgba(current.color, 0.4);
      ctx.shadowColor = current.color;
      ctx.shadowBlur = 20;
      ctx.fill();

      // Núcleo sólido
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fillStyle = current.color;
      ctx.fill();
      ctx.restore();

      if (arTexture) arTexture.needsUpdate = true;
      requestAnimationFrame(render);
    }

    // Navegación
    function updateLocation(newIndex) {
      previousIndex = currentIndex;
      currentIndex = newIndex;
      animStart = performance.now();
      particles = []; // Resetea partículas
      
      const loc = CHRONOLOGY[currentIndex];
      locationName.textContent = loc.city;
      colorDot.style.backgroundColor = loc.color;
      colorDot.style.color = loc.color;

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === CHRONOLOGY.length - 1;
    }

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) updateLocation(currentIndex - 1);
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex < CHRONOLOGY.length - 1) updateLocation(currentIndex + 1);
    });

    replayBtn.addEventListener("click", () => {
      updateLocation(currentIndex);
    });

    // Motor WebAR - Tres.js & MindAR
    let arActive = false;
    let arCompiler = null;
    
    toggleArBtn.addEventListener("click", async () => {
      const stage = document.getElementById("map-stage");
      const arCont = document.getElementById("ar-container");

      if (!arActive) {
        try {
          toggleArBtn.disabled = true;
          statusText.textContent = "Compilando Target AR...";

          if (!arCompiler) {
            const img = document.getElementById("base-map-img");
            if (!img.complete) await new Promise(r => img.onload = r);
            
            const compiler = new window.MINDAR.IMAGE.Compiler();
            await compiler.compileImageTargets([img], (p) => {
              statusText.textContent = `Procesando: ${Math.round(p)}%`;
            });
            const buffer = await compiler.exportData();
            const blob = new Blob([buffer]);
            const targetSrc = URL.createObjectURL(blob);

            arCompiler = new window.MINDAR.IMAGE.MindARThree({
              container: arCont,
              imageTargetSrc: targetSrc
            });

            const { renderer, scene, camera } = arCompiler;
            const anchor = arCompiler.addAnchor(0);

            // Vinculación del Canvas 2D al plano 3D
            arTexture = new THREE.CanvasTexture(canvas);
            const aspect = canvas.height / canvas.width;
            const mesh = new THREE.Mesh(
              new THREE.PlaneGeometry(1, aspect),
              new THREE.MeshBasicMaterial({ map: arTexture, transparent: true })
            );
            anchor.group.add(mesh);

            anchor.onTargetFound = () => statusText.textContent = "Target Detectado";
            anchor.onTargetLost = () => statusText.textContent = "Buscando Target...";

            await arCompiler.start();
            renderer.setAnimationLoop(() => renderer.render(scene, camera));
          } else {
            await arCompiler.start();
          }

          arActive = true;
          stage.style.display = "none";
          arCont.style.display = "block";
          toggleArBtn.textContent = "Volver a Vista Web";
        } catch (e) {
          statusText.textContent = "Error al iniciar cámara.";
          console.error(e);
        } finally {
          toggleArBtn.disabled = false;
        }
      } else {
        if (arCompiler) arCompiler.stop();
        arActive = false;
        stage.style.display = "flex";
        arCont.style.display = "none";
        toggleArBtn.textContent = "Activar Cámara AR";
        statusText.textContent = "Sistema 2D Activo";
      }
    });

    // Inicializar
    updateLocation(0);
    requestAnimationFrame(render);
  </script>
</body>
</html>
